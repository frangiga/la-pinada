<!DOCTYPE html>
<html lang="es">
<head>
<!-- SI ESTÁS VIENDO ESTO PARA SOLUCIONAR EL MULTI, ERES UN MISERABLE QUE NO MERECE ESTE CACHÉ -->
<!-- BUENO... TAMBIÉN UN GRAN HIJO O HIJA DE LA GRAN PUTA (QUE NO SE T'OLVIDE) -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>La Pinada - GCBXK9R</title>
<style>
:root {
    --bg-radial-center: #1e2922;
    --bg-radial-outer: #0f1411;
    --accent-green: #22c55e;
    --accent-green-light: #4ade80;
    --accent-green-glow: rgba(34, 197, 94, 0.45);
    --fluor-cyan: #00f3ff;
    --fluor-cyan-glow: rgba(0, 243, 255, 0.6);
    --card-bg: rgba(16, 24, 18, 0.88);
    --text-main: #ffffff;
}
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
}
html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 30%, var(--bg-radial-center) 0%, var(--bg-radial-outer) 100%);
    color: var(--text-main);
}
.container {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    height: 100%;
    height: 100dvh;
    padding: clamp(12px, 2.5vh, 20px) 16px;
}
header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-top: clamp(2px, 1vh, 10px);
}
.multi-logo {
    width: clamp(70px, 13vh, 100px);
    height: clamp(70px, 13vh, 100px);
    object-fit: contain;
    margin-bottom: clamp(4px, 1vh, 8px);
    -webkit-mask-image: radial-gradient(circle at center, black 38%, rgba(0,0,0,0.85) 45%, transparent 49.5%);
    mask-image: radial-gradient(circle at center, black 38%, rgba(0,0,0,0.85) 45%, transparent 49.5%);
    filter: drop-shadow(0 0 8px var(--accent-green-glow));
}
.title-main {
    font-size: clamp(1.1rem, 3vh, 1.4rem);
    font-weight: 800;
    letter-spacing: 3px;
    color: var(--accent-green);
    text-transform: uppercase;
    text-shadow: 0 0 10px var(--accent-green-glow);
    line-height: 1.1;
}
.gc-code {
    font-size: clamp(1.2rem, 3vh, 1.42rem);
    font-weight: 700;
    letter-spacing: 4px;
    color: #d1d5db;
    text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
    margin-top: clamp(4px, 1vh, 8px);
}
.display-card {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(34, 197, 94, 0.6);
    border-radius: 20px;
    width: 100%;
    max-width: 350px;
    padding: clamp(20px, 3.8vh, 30px) 20px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 15px var(--accent-green-glow), inset 0 0 12px rgba(34, 197, 94, 0.15);
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 2vh, 16px);
    margin: auto 0;
}
.label {
    font-size: clamp(0.85rem, 2vh, 1rem);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--accent-green-light);
    text-shadow: 0 0 6px var(--accent-green-glow);
}
.value {
    font-size: clamp(2.8rem, 7vh, 3.8rem);
    font-weight: 800;
    color: var(--fluor-cyan);
    text-shadow: 0 0 14px var(--fluor-cyan-glow), 0 0 28px var(--fluor-cyan-glow);
    min-height: clamp(3.5rem, 8vh, 4.5rem);
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 1px;
}
.status-gps {
    font-size: clamp(0.8rem, 1.8vh, 0.9rem);
    font-weight: 500;
    color: #94a3b8;
    letter-spacing: 0.5px;
}
.footer-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 350px;
    gap: clamp(8px, 1.8vh, 14px);
    margin-bottom: clamp(2px, 1vh, 8px);
}
.btn-query {
    width: 100%;
    padding: clamp(14px, 2vh, 17px);
    font-size: clamp(1rem, 2.3vh, 1.15rem);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #ffffff;
    background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 50px;
    cursor: pointer;
    outline: none;
    box-shadow: 0 6px 20px var(--accent-green-glow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    -webkit-tap-highlight-color: transparent;
}
.btn-query:active {
    transform: scale(0.97);
    box-shadow: 0 2px 10px var(--accent-green-glow);
}
.btn-query:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}
.btn-advance {
    background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
    box-shadow: 0 6px 20px rgba(13, 148, 136, 0.45);
    display: none;
    margin-top: 8px;
}
/* Estilos para la ventana emergente (Modal) */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 20px;
}
.modal-card {
    background: var(--card-bg);
    border: 1px solid rgba(34, 197, 94, 0.6);
    border-radius: 20px;
    width: 100%;
    max-width: 350px;
    padding: clamp(24px, 4vh, 36px) 24px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 20px var(--accent-green-glow);
    display: flex;
    flex-direction: column;
    gap: clamp(16px, 3vh, 24px);
}
.modal-text {
    font-size: clamp(0.95rem, 2.2vh, 1.1rem);
    line-height: 1.5;
    color: #e2e8f0;
    text-align: center;
}
footer {
    font-size: clamp(0.75rem, 1.6vh, 0.82rem);
    color: #64748b;
    letter-spacing: 1px;
}
footer a {
    color: var(--accent-green-light);
    text-decoration: none;
    font-weight: 600;
    transition: color 0.2s ease;
}
footer a:hover {
    color: var(--fluor-cyan);
}
</style>
</head>
<body>
<div class="container">
    <header>
        <img class="multi-logo" src="https://frangiga.github.io/reverse-cache-reloaded/Multi.png" alt="Multi Cache Logo">
        <div class="title-main">La Pinada</div>
        <div class="gc-code">GCBXK9R</div>
    </header>
    <main class="display-card">
        <div class="label" id="label-etapa">INICIO</div>
        <div id="distancia-display" class="value">-- m</div>
        <div id="status-display" class="status-gps">Pulsa para consultar ubicación</div>
        <button id="btn-avanzar" class="btn-query btn-advance" onclick="avanzarParada()">Tengo el dato. Avanzar.</button>
    </main>
    <div class="footer-section">
        <button id="btn-consultar" class="btn-query" onclick="obtenerUbicacionGPS()">Consultar Metros</button>
        <footer>Desarrollado por <a href="https://www.instagram.com/fran_giga/" target="_blank" rel="noopener noreferrer">fran_giga</a></footer>
    </div>
</div>

<!-- Ventana emergente (Modal) -->
<div id="modal-instrucciones" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-text">Busca en cada una de las cuatro etapas una madera con un número con formato de puntos, y júntalos para usar en el Certitude.</div>
        <button class="btn-query" onclick="cerrarModalYComenzarEtapa1()">Avanzar</button>
    </div>
</div>

<script>
// Punto de Inicio y Paradas secuenciales del juego (Latitud y Longitud en decimales)
const PUNTO_INICIO = { lat: 39.5492000, lon: -1.2822500 }; // N 39° 32.952′ W 1° 16.935′

const PARADAS = [
    { num: 1, lat: 39.5490833, lon: -1.2840167, label: "Etapa 1" }, // N 39° 32.945′ W 1° 17.041′
    { num: 2, lat: 39.5482333, lon: -1.2855667, label: "Etapa 2" }, // N 39° 32.894′ W 1° 17.134′
    { num: 3, lat: 39.5468833, lon: -1.2844833, label: "Etapa 3" }, // N 39° 32.813′ W 1° 17.069′
    { num: 4, lat: 39.5479833, lon: -1.2822000, label: "Etapa 4 (Final)" } // N 39° 32.879′ W 1° 16.932′
];

const RADIO_ACTIVACION = 10; // 10 metros de radio

// Estado del juego almacenado localmente
let juegoIniciado = localStorage.getItem("la_pinada_iniciado") === "true";
let modalMostrado = localStorage.getItem("la_pinada_modal") === "true";
let etapaActual = parseInt(localStorage.getItem("la_pinada_etapa")) || 0;
let juegoTerminado = localStorage.getItem("la_pinada_terminado") === "true";
let watchId = null;

// Inicializar interfaz según estado guardado
window.addEventListener("DOMContentLoaded", () => {
    if (juegoTerminado) {
        mostrarPantallaFinal();
    } else if (juegoIniciado) {
        document.getElementById("label-etapa").innerText = PARADAS[etapaActual].label;
    } else {
        document.getElementById("label-etapa").innerText = "INICIO";
    }
});

function calcularHaversine(lat1, lon1, lat2, lon2) {
    const R = 6371000; // Radio de la Tierra en metros
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return Math.round(R * c);
}

function obtenerUbicacionGPS() {
    if (juegoTerminado) return;
    const status = document.getElementById("status-display");
    const btn = document.getElementById("btn-consultar");
    status.innerText = "Conectando con satélites GPS...";
    btn.disabled = true;

    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
    }

    if (!("geolocation" in navigator)) {
        status.innerText = "GPS no compatible en este navegador.";
        btn.disabled = false;
        return;
    }

    let mejorUbicacion = null;
    let contadorIntentos = 0;
    const opcionesGPS = { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 };

    const finalizarMedicion = (posicion) => {
        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }
        btn.disabled = false;
        procesarCoordenadas(posicion.coords.latitude, posicion.coords.longitude);
    };

    const timerFuerzaBruta = setTimeout(() => {
        if (mejorUbicacion) {
            finalizarMedicion(mejorUbicacion);
        } else {
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            status.innerText = "Error GPS: Mala recepción de satélites.";
            btn.disabled = false;
        }
    }, 10000);

    watchId = navigator.geolocation.watchPosition((posicion) => {
        contadorIntentos++;
        const precisionActual = Math.round(posicion.coords.accuracy);
        status.innerText = `Calibrando GPS (Margen: ±${precisionActual}m)...`;

        if (!mejorUbicacion || posicion.coords.accuracy < mejorUbicacion.coords.accuracy) {
            mejorUbicacion = posicion;
        }

        if (precisionActual <= 15 || contadorIntentos >= 4) {
            clearTimeout(timerFuerzaBruta);
            finalizarMedicion(mejorUbicacion);
        }
    }, (error) => {
        clearTimeout(timerFuerzaBruta);
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        btn.disabled = false;
        switch(error.code) {
            case error.PERMISSION_DENIED:
                status.innerText = "Permiso de ubicación denegado.";
                break;
            case error.POSITION_UNAVAILABLE:
                status.innerText = "Ubicación no disponible. Activa el GPS.";
                break;
            case error.TIMEOUT:
                status.innerText = "Tiempo de espera agotado al buscar GPS.";
                break;
            default:
                status.innerText = "Error GPS al obtener ubicación.";
        }
    }, opcionesGPS);
}

function procesarCoordenadas(lat, lon) {
    const displayMetros = document.getElementById("distancia-display");
    const status = document.getElementById("status-display");
    const btnAvanzar = document.getElementById("btn-avanzar");

    if (!juegoIniciado) {
        // Validación estricta del punto de inicio (< 10 metros) sin mostrar distancias si está fuera
        const distInicio = calcularHaversine(lat, lon, PUNTO_INICIO.lat, PUNTO_INICIO.lon);
        if (distInicio <= RADIO_ACTIVACION) {
            juegoIniciado = true;
            localStorage.setItem("la_pinada_iniciado", "true");
            
            // Si el modal no se ha mostrado, mostrarlo antes de pasar oficialmente a Etapa 1
            if (!modalMostrado) {
                document.getElementById("modal-instrucciones").style.display = "flex";
                return;
            }

            etapaActual = 0;
            localStorage.setItem("la_pinada_etapa", etapaActual);
            
            document.getElementById("label-etapa").innerText = PARADAS[etapaActual].label;
            displayMetros.innerText = "-- m";
            displayMetros.style.color = "#00f3ff";
            status.innerText = "Pulsa para consultar ubicación";
        } else {
            displayMetros.innerText = "---";
            displayMetros.style.color = "#ff4444";
            status.innerText = "Estás fuera del rango del punto de inicio.";
        }
        return;
    }

    // Juego ya iniciado: calcular metros hacia la etapa actual correspondiente
    const destino = PARADAS[etapaActual];
    const metros = calcularHaversine(lat, lon, destino.lat, destino.lon);

    document.getElementById("label-etapa").innerText = destino.label;

    if (metros <= RADIO_ACTIVACION) {
        displayMetros.innerText = "¡EN EL GZ!";
        displayMetros.style.color = "#22c55e";
        status.innerText = `¡Has llegado a la ${destino.label}!`;
        btnAvanzar.style.display = "block"; // Muestra el botón de avanzar
    } else {
        displayMetros.innerText = `${metros} m`;
        displayMetros.style.color = "#00f3ff";
        status.innerText = "Ubicación confirmada. Acércate al objetivo.";
        btnAvanzar.style.display = "none";
    }
}

function cerrarModalYComenzarEtapa1() {
    modalMostrado = true;
    localStorage.setItem("la_pinada_modal", "true");
    document.getElementById("modal-instrucciones").style.display = "none";
    
    etapaActual = 0;
    localStorage.setItem("la_pinada_etapa", etapaActual);
    document.getElementById("label-etapa").innerText = PARADAS[etapaActual].label;
    document.getElementById("distancia-display").innerText = "-- m";
    document.getElementById("distancia-display").style.color = "#00f3ff";
    document.getElementById("status-display").innerText = "Pulsa para consultar ubicación";
}

function avanzarParada() {
    const btnAvanzar = document.getElementById("btn-avanzar");
    btnAvanzar.style.display = "none";

    if (etapaActual < PARADAS.length - 1) {
        etapaActual++;
        localStorage.setItem("la_pinada_etapa", etapaActual);
        document.getElementById("label-etapa").innerText = PARADAS[etapaActual].label;
        document.getElementById("distancia-display").innerText = "-- m";
        document.getElementById("status-display").innerText = "Pulsa para consultar nueva ubicación";
    } else {
        // Llegada a la cuarta parada (final)
        juegoTerminado = true;
        localStorage.setItem("la_pinada_terminado", "true");
        mostrarPantallaFinal();
    }
}

function mostrarPantallaFinal() {
    document.getElementById("label-etapa").innerText = "¡JUEGO COMPLETADO!";
    document.getElementById("distancia-display").innerText = "FIN";
    document.getElementById("distancia-display").style.color = "#4ade80";
    document.getElementById("status-display").innerText = "Has superado todas las etapas de La Pinada.";
    document.getElementById("btn-avanzar").style.display = "none";
    
    const btnConsultar = document.getElementById("btn-consultar");
    btnConsultar.innerText = "Acceder a Certitude";
    btnConsultar.style.background = "linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%)";
    btnConsultar.setAttribute("onclick", "window.open('https://www.certitudes.org/certitude?wp=GCBXK9R', '_blank')");
}
</script>
</body>
</html>
